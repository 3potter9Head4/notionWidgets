<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dynamics 1 countdown</title><style>
:root{color-scheme:light;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;background:transparent;overflow:hidden}body{padding:3px}.card{width:100%;min-height:91px;border:1px solid #e9e9e9;border-radius:11px;background:white;color:#292929;padding:12px 13px;display:flex;align-items:center;gap:13px}.count{flex:0 0 57px;text-align:left}.number{font-size:43px;line-height:.95;letter-spacing:-.07em;font-weight:750;color:#292929;font-variant-numeric:tabular-nums}.unit{font-size:10px;color:#888;margin-top:5px;white-space:nowrap}.detail{min-width:0;flex:1}.name{font-size:13px;font-weight:700;line-height:1.2;margin-bottom:5px;overflow-wrap:break-word}.date{font-size:10.5px;color:#747474;line-height:1.35}.meta{display:flex;gap:10px;align-items:center;margin-top:5px;color:#888;font-size:10px;flex-wrap:wrap}.meta strong{color:#444;font-weight:650}@media(max-width:240px){.card{padding:10px;gap:9px}.count{flex-basis:48px}.number{font-size:36px}.name{font-size:12px}.date,.meta{font-size:10px}}
</style></head><body><article class="card"><div class="count"><div class="number" id="days">—</div><div class="unit" id="unit">days left</div></div><div class="detail"><div class="name">Dynamics 1</div><div class="date">Thu 5 Nov · 13:45–16:45</div><div class="meta"><span>4 EC</span><span>target <strong>9</strong></span></div></div></article><script>
function update(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Amsterdam',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const n=k=>Number(parts.find(p=>p.type===k).value);const today=Date.UTC(n('year'),n('month')-1,n('day'));const [y,m,d]='2026-11-05'.split('-').map(Number);const days=Math.round((Date.UTC(y,m-1,d)-today)/86400000);document.getElementById('days').textContent=days>=0?days:'✓';document.getElementById('unit').textContent=days>1?'days left':days===1?'day left':days===0?'today':'completed'}update();setInterval(update,60000);
</script></body></html>
