<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vector Calculus for ME (resit) countdown</title>
<style>:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;background:transparent;overflow:hidden}.card{min-height:174px;background:#1d1d23;border:1px solid #36363e;border-radius:17px;color:#f0efed;padding:18px 20px;display:flex;flex-direction:column;justify-content:center;gap:13px}.heading{font-size:14px;font-weight:750;letter-spacing:.01em}.main{display:flex;align-items:center;gap:17px;min-width:0}.count{flex-shrink:0;min-width:77px}.number{font-size:66px;line-height:.93;font-weight:780;letter-spacing:-.07em;color:#e7e3e0;font-variant-numeric:tabular-nums}.unit{font-size:12px;color:#aaa9b3;padding-top:7px}.info{min-width:0;flex:1;display:flex;flex-direction:column;gap:7px}.date{font-size:12px;color:#b4b2bf;line-height:1.4}.meta{font-size:12px;color:#aaa9b3;display:flex;align-items:baseline;justify-content:space-between;gap:12px}.meta strong{color:#f0efed;font-size:19px}@media(max-width:320px){.card{padding:14px}.number{font-size:56px}.main{gap:12px}.count{min-width:67px}}</style></head>
<body><article class="card" aria-label="Countdown to Vector Calculus for ME (resit) exam"><div class="heading">Exam countdown</div><div class="main"><div class="count"><div class="number" id="days">—</div><div class="unit" id="unit">days</div></div><div class="info"><div class="heading">Vector Calculus for ME (resit)</div><div class="date">Fri 6 Nov<br>13:45–15:45</div><div class="meta"><span>2 EC</span><span>target <strong>9</strong></span></div></div></div></article>
<script>const examDate='2026-11-06';function update(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Amsterdam',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const get=k=>Number(parts.find(p=>p.type===k).value);const todayUTC=Date.UTC(get('year'),get('month')-1,get('day'));const [y,m,d]=examDate.split('-').map(Number);const delta=Math.round((Date.UTC(y,m-1,d)-todayUTC)/86400000);document.getElementById('days').textContent=delta>=0?delta:'✓';document.getElementById('unit').textContent=delta>1?'days left':delta===1?'day left':delta===0?'exam day!':'completed'}update();setInterval(update,60000);</script></body></html>
